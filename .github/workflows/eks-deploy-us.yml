# US account (293354045404) copy of eks-deploy.yml. Temporary, for the move to that account: same steps,
# pushing to the new account's ECR with secrets.AWS_DEPLOY_ROLE_ARN_US. Promote bumps overlays/us-prod
# and skips with a warning until that overlay is on maplecare-infra main. At cutover this file replaces
# eks-deploy.yml.

name: Build & Push to ECR (US account)

on:
  # Manual only for now. Add the push trigger back (as in the original) once the us-prod overlay
  # is on maplecare-infra main.
  workflow_dispatch:

concurrency:
  group: twilio-webphone-ecr-us
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2

permissions:
  id-token: write
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC), US account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_US }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag (git SHA)
        id: vars
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/twilio-webphone:${{ steps.vars.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/twilio-webphone:latest
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/twilio-webphone:buildcache
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/twilio-webphone:buildcache,mode=max

      - name: Image summary
        run: |
          {
            echo "### Pushed to ECR, US account"
            echo ""
            echo '```'
            echo "twilio-webphone:${{ steps.vars.outputs.tag }}   (+ :latest)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    needs: build-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
    steps:
      - name: Checkout maplecare-infra
        uses: actions/checkout@v4
        with:
          repository: maplecare-ai/maplecare-infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          ref: main

      - name: Bump image tag and push
        env:
          TAG: ${{ needs.build-push.outputs.tag }}
          ECR: 291510858453.dkr.ecr.us-west-2.amazonaws.com
        run: |
          f="kubernetes/apps/twilio-webphone/overlays/us-prod/kustomization.yaml"
          if [ ! -f "$f" ]; then echo "::warning::$f not on maplecare-infra main yet, skipping"; exit 0; fi
          NAME="$ECR/twilio-webphone" yq -i \
            '(.images[] | select(.name == strenv(NAME)) | .newTag) = strenv(TAG)' "$f"
          git config user.name  "maplecare-ci-bot"
          git config user.email "dev@maplecare.ai"
          git add "$f"
          if git diff --cached --quiet; then echo "no tag change"; exit 0; fi
          git commit -m "automated: twilio-webphone us-prod -> $TAG"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase --autostash origin main
          done
          echo "::error::failed to push to maplecare-infra after retries"; exit 1
